<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft GUI 配置编辑器</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div><strong>GUI 配置台</strong><small>Minecraft 26.2 物品库</small></div>
    </div>
    <div class="header-actions">
      <span id="saveState" class="save-state">已保存</span>
      <button class="icon-button" id="undoBtn" title="撤销" aria-label="撤销" disabled><i data-lucide="undo-2"></i></button>
      <button class="icon-button" id="redoBtn" title="重做" aria-label="重做" disabled><i data-lucide="redo-2"></i></button>
      <button class="secondary-button" id="clearBtn"><i data-lucide="trash-2"></i>清空</button>
      <button class="primary-button" id="exportBtn"><i data-lucide="file-down"></i>导出给 AI</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="library-panel" aria-label="物品库">
      <div class="panel-heading">
        <div><span class="eyebrow">ITEM LIBRARY</span><h1>物品库</h1></div>
        <span class="count-badge" id="itemCount">0</span>
      </div>
      <label class="search-box">
        <i data-lucide="search"></i>
        <input id="searchInput" type="search" placeholder="搜索物品 ID" autocomplete="off">
      </label>
      <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="物品分类"></div>
      <div class="item-grid" id="itemGrid" aria-live="polite"></div>
      <div class="library-footer"><span>拖入槽位，或先选槽位再点击物品</span><kbd>Del</kbd><span>删除</span></div>
    </aside>

    <section class="canvas-panel">
      <div class="canvas-toolbar">
        <div>
          <span class="eyebrow">LAYOUT</span>
          <input id="guiTitle" class="title-input" value="&8自定义界面" aria-label="GUI 标题">
        </div>
        <div class="segmented" role="group" aria-label="界面布局">
          <button data-layout="chest54" class="active">6×9 箱子</button>
          <button data-layout="player">箱子 + 背包</button>
        </div>
      </div>

      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="minecraft-window">
            <div class="window-label" id="containerLabel">大型箱子 · 54 槽</div>
            <div id="containerGrid" class="slot-grid cols-9" aria-label="GUI 槽位"></div>
            <div id="playerArea" class="player-area hidden">
              <div class="window-label sub-label">玩家物品栏</div>
              <div id="inventoryGrid" class="slot-grid cols-9"></div>
              <div id="hotbarGrid" class="slot-grid cols-9 hotbar"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="canvas-status">
        <span><i data-lucide="mouse-pointer-2"></i><b id="filledCount">0</b> 个已配置槽位</span>
        <span id="selectedStatus">未选择槽位</span>
      </div>
    </section>

    <aside class="inspector-panel" aria-label="物品属性">
      <div class="panel-heading"><div><span class="eyebrow">INSPECTOR</span><h2>槽位属性</h2></div></div>
      <div id="emptyInspector" class="empty-inspector">
        <div class="empty-slot"><i data-lucide="mouse-pointer-click"></i></div>
        <strong>选择一个槽位</strong>
        <p>放入物品后可设置名称、作用、Lore、附魔和额外 NBT。</p>
      </div>
      <form id="itemForm" class="item-form hidden">
        <div class="selected-item-head">
          <div class="item-preview" id="itemPreview"></div>
          <div><strong id="selectedMaterial">-</strong><span id="selectedSlot">槽位 0</span></div>
          <button type="button" class="icon-button danger" id="removeItemBtn" title="移除物品" aria-label="移除物品"><i data-lucide="x"></i></button>
        </div>

        <label>物品名称<input name="name" placeholder="&a确认按钮"></label>
        <div class="field-row"><label>数量<input name="amount" type="number" min="1" max="99" value="1"></label><label>自定义模型数据<input name="customModelData" type="number" min="0" placeholder="可选"></label></div>
        <label>槽位作用<input name="role" placeholder="例如：确认按钮、输入槽位"></label>
        <label>开发备注<textarea name="note" rows="2" placeholder="说明该物品在插件中的行为"></textarea></label>
        <label>Lore（每行一条）<textarea name="lore" rows="5" placeholder="&7点击确认操作&#10;&e消耗：%price%"></textarea></label>

        <div class="toggle-row">
          <label class="toggle"><input name="glint" type="checkbox"><span></span>显示附魔光效</label>
          <label class="toggle"><input name="unbreakable" type="checkbox"><span></span>不可破坏</label>
        </div>

        <details>
          <summary>高级属性与 NBT <i data-lucide="chevron-down"></i></summary>
          <div class="details-body">
            <label>附魔（每行 `名称:等级`）<textarea name="enchantments" rows="3" placeholder="sharpness:5"></textarea></label>
            <label>物品属性 JSON<textarea name="attributes" rows="4" placeholder='{"generic.attack_damage": 8}'></textarea></label>
            <label>额外 NBT / PDC JSON<textarea name="nbt" rows="5" placeholder='{"plugin:key": "value"}'></textarea></label>
          </div>
        </details>
      </form>
    </aside>
  </main>

  <dialog id="exportDialog" class="export-dialog">
    <div class="dialog-head"><div><span class="eyebrow">EXPORT</span><h2>提交给 AI</h2></div><button class="icon-button" id="closeExportBtn" aria-label="关闭"><i data-lucide="x"></i></button></div>
    <div class="export-options">
      <div class="segmented" id="exportFormat"><button data-format="yaml" class="active">YAML 配置</button><button data-format="json">JSON 数据</button><button data-format="prompt">AI 提示词</button></div>
      <button class="secondary-button" id="downloadBtn"><i data-lucide="download"></i>下载</button>
      <button class="primary-button" id="copyBtn"><i data-lucide="copy"></i>复制</button>
    </div>
    <textarea id="exportOutput" spellcheck="false" aria-label="导出内容"></textarea>
    <p class="dialog-note">导出内容包含布局、槽位编号、物品属性和开发备注，可直接附在插件开发需求中。</p>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="items.js?v=1"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
